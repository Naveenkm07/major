version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: krushikadhara_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend_node_api
      dockerfile: Dockerfile
    container_name: krushikadhara_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/krushikadhara
      - JWT_SECRET=local_development_super_secret_key_123
      - JWT_EXPIRE=30d
      - AI_SERVICE_URL=http://ai_service:8000
    depends_on:
      - mongodb
    restart: unless-stopped

  ai_service:
    build:
      context: ./ai_service_python
      dockerfile: Dockerfile
    container_name: krushikadhara_ai
    ports:
      - "8000:8000"
    volumes:
      - ./ai_service_python:/app
    environment:
      - PORT=8000
    restart: unless-stopped

volumes:
  mongo_data:
