name: KrushikaDhara CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  BACKEND_IMAGE: krushikadhara-backend:latest
  AI_IMAGE: krushikadhara-ai:latest

jobs:
  test-and-build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend_node_api
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './backend_node_api/package-lock.json'

      - name: Install Node Dependencies
        run: npm ci

      # - name: Run Backend Tests
      #   run: npm test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Build and Push Backend Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./backend_node_api
          push: true
          tags: ${{ env.DOCKER_HUB_USERNAME }}/${{ env.BACKEND_IMAGE }}

  test-and-build-ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai_service_python

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # - name: Run Python Tests
      #   run: pytest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Build and Push AI Microservice Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./ai_service_python
          push: true
          tags: ${{ env.DOCKER_HUB_USERNAME }}/${{ env.AI_IMAGE }}

  deploy-to-render:
    needs: [test-and-build-backend, test-and-build-ai]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Backend Deploy
        run: |
          curl -X POST ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
          
      - name: Trigger Render AI Deploy
        run: |
          curl -X POST ${{ secrets.RENDER_AI_DEPLOY_HOOK }}
