name: krushikadhara
description: KrushikaDhara - Smart Farming Companion

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── UI & Design ────────────────────────────────────
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  fl_chart: ^0.66.0
  flutter_animate: ^4.5.0
  flutter_staggered_animations: ^1.1.1

  # ─── State Management ──────────────────────────────
  provider: ^6.1.1

  # ─── Networking ─────────────────────────────────────
  http: ^1.2.0
  dio: ^5.4.0
  http_parser: ^4.0.2

  # ─── Storage ────────────────────────────────────────
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # ─── Camera & Image ────────────────────────────────
  image_picker: ^1.0.7
  camera: ^0.10.5+9

  # ─── Calendar ──────────────────────────────────────
  table_calendar: ^3.1.2

  # ─── Firebase ──────────────────────────────────────
  firebase_core: ^2.32.0
  firebase_messaging: ^14.7.15

  # ─── Location ──────────────────────────────────────
  geolocator: ^11.0.0
  geocoding: ^2.1.1

  # ─── Utilities ─────────────────────────────────────
  intl: ^0.19.0
  url_launcher: ^6.2.4
  connectivity_plus: ^5.0.2
  uuid: ^4.3.3
  timeago: ^3.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_maps_flutter: ^2.14.2
  firebase_auth: ^4.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
